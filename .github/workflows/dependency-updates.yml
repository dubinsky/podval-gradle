# Reusable dependency-update check for a repository that applies
# org.podval.conventions.settings (the root dependencyUpdates task and its rejectVersionIf).
#
# Alert: one issue titled "Dependency updates available".
#   - a dependency update, or a current-channel Gradle update → create or update that issue
#   - neither → close the open issue if present
# A Gradle release candidate alone does not open the issue. The full report is still
# in the issue body when the issue is open.
#
# Caller (another repository). Pin <ref> to a commit or tag that contains this file.
# The 0.1.0 tag does not. Issues must be enabled on the caller repository.
#
#   name: Dependency updates
#   on:
#     schedule:
#       - cron: "0 12 * * 1"
#     workflow_dispatch:
#   permissions:
#     contents: read
#     issues: write
#   jobs:
#     dependency-updates:
#       uses: dubinsky/podval-gradle/.github/workflows/dependency-updates.yml@<ref>
#
# This repository's caller is dependency-updates-check.yml, which uses the relative path.

name: Dependency updates (reusable)

on:
  workflow_call:

permissions:
  contents: read
  issues: write

concurrency:
  group: dependency-updates-${{ github.repository }}
  cancel-in-progress: true

jobs:
  dependency-updates:
    name: Check for dependency updates
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Java (Temurin 25)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run dependencyUpdates
        run: ./gradlew dependencyUpdates --output-formatter=json,plain

      - name: Parse report and notify via Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: Dependency updates available
          REPORT_TXT: build/dependencyUpdates/report.txt
          REPORT_JSON: build/dependencyUpdates/report.json
        run: |
          set -euo pipefail

          if [[ ! -f "$REPORT_JSON" ]]; then
            echo "::error::Missing $REPORT_JSON"
            exit 1
          fi

          OUTDATED="$(python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(r.get("outdated",{}).get("count",0))' "$REPORT_JSON")"
          GRADLE_UPDATE="$(python3 -c 'import json,sys; c=json.load(open(sys.argv[1])).get("gradle",{}).get("current",{}); print("true" if c.get("isUpdateAvailable") else "false")' "$REPORT_JSON")"
          GRADLE_FAILURE="$(python3 -c 'import json,sys; c=json.load(open(sys.argv[1])).get("gradle",{}).get("current",{}); print("true" if c.get("isFailure") else "false")' "$REPORT_JSON")"
          GRADLE_VERSION="$(python3 -c 'import json,sys; c=json.load(open(sys.argv[1])).get("gradle",{}).get("current",{}); print(c.get("version") or "")' "$REPORT_JSON")"
          GRADLE_REASON="$(python3 -c 'import json,sys; c=json.load(open(sys.argv[1])).get("gradle",{}).get("current",{}); print(c.get("reason") or "")' "$REPORT_JSON")"

          echo "outdated.count=$OUTDATED gradle.current.update=$GRADLE_UPDATE version=${GRADLE_VERSION}"
          if [[ "$GRADLE_FAILURE" == "true" ]]; then
            echo "::warning::Gradle current-channel check failed: ${GRADLE_REASON}"
          fi

          EXISTING="$(gh issue list --state open --limit 50 --json number,title \
            --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n1 || true)"

          if [[ "$OUTDATED" -gt 0 || "$GRADLE_UPDATE" == "true" ]]; then
            if [[ "$GRADLE_UPDATE" == "true" ]]; then
              GRADLE_LINE="Gradle current channel: **${GRADLE_VERSION}** is available."
            else
              GRADLE_LINE="Gradle current channel: no update."
            fi
            BODY_FILE="$(mktemp)"
            {
              echo "Automated report from [\`dependencyUpdates\`](https://github.com/ben-manes/gradle-versions-plugin)."
              echo
              echo "Outdated dependencies: **${OUTDATED}**"
              echo
              echo "$GRADLE_LINE"
              echo
              echo "<details><summary>Full report</summary>"
              echo
              echo '```'
              if [[ -f "$REPORT_TXT" ]]; then
                cat "$REPORT_TXT"
              else
                python3 -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1])), indent=2))' "$REPORT_JSON"
              fi
              echo '```'
              echo
              echo "</details>"
              echo
              echo "_Updated on each run while a dependency update or a current-channel Gradle update remains. Closed when neither remains. A Gradle release candidate alone does not keep this issue open._"
            } > "$BODY_FILE"

            if [[ -n "${EXISTING}" ]]; then
              echo "Updating open issue #${EXISTING}"
              gh issue edit "$EXISTING" --body-file "$BODY_FILE"
            else
              echo "Creating issue: ${ISSUE_TITLE}"
              gh issue create --title "$ISSUE_TITLE" --body-file "$BODY_FILE"
            fi
          else
            echo "No dependency or current-channel Gradle updates."
            if [[ -n "${EXISTING}" ]]; then
              echo "Closing issue #${EXISTING}"
              gh issue close "$EXISTING" --comment "No dependency or current-channel Gradle updates on the latest run. Closing automatically."
            fi
          fi
