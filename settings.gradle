pluginManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
}

plugins {
  id 'org.podval.conventions.settings' version '0.4.0'
}

rootProject.name = 'org.podval.conventions'

// This handler is not empty, so conventions.settings does not add Central.
// gradlePluginPortal() stays: gradle-versions-plugin 0.67.0 and foojay-resolver
// 1.0.0 are not on Maven Central (README, checked 2026-11-09).
dependencyResolutionManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
}

// podvalCentral=true makes conventions.settings apply nmcp (USER_MANAGED).
// ./gradlew nmcpZipAggregation — inspect the zip
// ./gradlew publishAggregationToCentralPortal — upload
// ./gradlew nmcpPublishDeployment -PnmcpDeploymentId=… — release
