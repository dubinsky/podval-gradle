pluginManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
}

plugins {
  id 'org.podval.conventions.settings' version '0.2.0'
}

rootProject.name = 'org.podval.conventions'

// mavenCentral() comes from conventions.settings. This project's implementation
// deps (gradle-versions-plugin, foojay-resolver) are on the Plugin Portal.
dependencyResolutionManagement {
  repositories {
    gradlePluginPortal()
  }
}

// podvalCentral=true makes conventions.settings apply nmcp (USER_MANAGED).
// ./gradlew nmcpZipAggregation — inspect the zip
// ./gradlew publishAggregationToCentralPortal — upload
// ./gradlew nmcpPublishDeployment -PnmcpDeploymentId=… — release
