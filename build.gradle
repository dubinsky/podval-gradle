plugins {
  id 'java-gradle-plugin'
  id 'maven-publish'
  id 'signing'
  // Same artifact as settings 0.1.0 already on the classpath; a version here fails
  // ("plugin is already on the classpath with an unknown version").
  id 'org.podval.conventions'
  id 'org.podval.conventions.publish'
}

description = 'Shared Gradle conventions for Podval (and other) projects'
group = 'org.podval.conventions'

podvalPublish {
  gitHubRepository = 'dubinsky/podval-gradle'
  name = 'Podval Gradle Conventions'
  inceptionYear = '2026'
}

dependencies {
  implementation 'io.github.ben-manes:gradle-versions-plugin:0.63.1'
  implementation 'org.gradle.toolchains:foojay-resolver:1.0.0'
  testImplementation 'org.junit.jupiter:junit-jupiter:6.1.3'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

gradlePlugin {
  plugins {
    settingsConventions {
      id = 'org.podval.conventions.settings'
      implementationClass = 'org.podval.conventions.ConventionsSettingsPlugin'
      displayName = 'Podval settings conventions'
      description = 'Foojay toolchain resolver and Maven Central for dependency resolution'
    }
    conventions {
      id = 'org.podval.conventions'
      implementationClass = 'org.podval.conventions.ConventionsPlugin'
      displayName = 'Podval project conventions'
      description = 'dependencyUpdates filters, Java 25 toolchain, Scala 3 compiler flags'
    }
    publishConventions {
      id = 'org.podval.conventions.publish'
      implementationClass = 'org.podval.conventions.ConventionsPublishPlugin'
      displayName = 'Podval publish conventions'
      description = 'Maven Central publication POM, sources/javadoc jars, and in-memory signing'
    }
  }
}

tasks.named('test', Test) {
  useJUnitPlatform()
}

tasks.named('javadoc', Javadoc) {
  options.addStringOption('Xdoclint:none', '-quiet')
}

def expectedPluginVersion = version.toString()
def checkReadmeVersion = tasks.register('checkReadmeVersion') {
  group = 'verification'
  description = 'Fails if README.adoc plugin versions do not match project.version.'
  def readmeFile = file('README.adoc')
  inputs.file(readmeFile)
  inputs.property('expected', expectedPluginVersion)
  doLast {
    def found = (readmeFile.getText('UTF-8') =~ /id 'org\.podval\.conventions[^']*' version '[0-9][0-9A-Za-z._-]*'/).findAll().toSet()
    def expected = [
      "id 'org.podval.conventions.settings' version '${expectedPluginVersion}'",
      "id 'org.podval.conventions' version '${expectedPluginVersion}'",
      "id 'org.podval.conventions.publish' version '${expectedPluginVersion}'"
    ] as Set
    if (found != expected) {
      throw new GradleException("README.adoc plugin id versions ${found} must all be ${expected}")
    }
  }
}
tasks.named('check') { dependsOn(checkReadmeVersion) }
